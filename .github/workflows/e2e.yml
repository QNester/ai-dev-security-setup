name: E2E

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  ubuntu:
    name: Ubuntu ${{ matrix.ubuntu }}
    runs-on: ubuntu-${{ matrix.ubuntu }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ["22.04", "24.04"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.22.x
      - name: Build Linux artifacts
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
            -o dist/sandboxctl-linux-amd64 ./cmd/sandboxctl
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go test -c -tags=e2e \
            -o dist/e2e-linux-amd64.test ./tests/e2e/guest
      - name: Run disposable lifecycle suite
        env:
          SANDBOXCTL_E2E: "1"
        run: |
          go run ./tests/e2e/runner \
            --provider hosted \
            --arch amd64 \
            --sandboxctl "$PWD/dist/sandboxctl-linux-amd64" \
            --e2e-test "$PWD/dist/e2e-linux-amd64.test"
